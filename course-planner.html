<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교 거리 계산기 — 광교로 145 기준</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #30363d;
    --accent: #58a6ff;
    --accent2: #3fb950;
    --accent3: #f78166;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 헤더 */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    z-index: 100;
  }

  .header-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--text);
  }

  .header-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    margin-left: auto;
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* 왼쪽 패널 */
  .sidebar {
    width: 400px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .origin-card {
    background: var(--surface2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  .origin-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .origin-addr {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .calc-btn {
    width: 100%;
    padding: 11px;
    background: var(--accent);
    color: #0d1117;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .calc-btn:hover { background: #79bfff; }
  .calc-btn:disabled { background: var(--border); color: var(--text3); cursor: not-allowed; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(0,0,0,0.2);
    border-top-color: #0d1117;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 학교 리스트 */
  .school-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }

  .school-list::-webkit-scrollbar { width: 4px; }
  .school-list::-webkit-scrollbar-track { background: transparent; }
  .school-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .school-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .school-card:hover { border-color: var(--accent); }
  .school-card.active { border-color: var(--accent); background: rgba(88,166,255,0.07); }

  .school-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }

  .school-idx {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--bg);
    padding: 2px 6px;
    border-radius: 3px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .school-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
    line-height: 1.4;
  }

  .school-addr {
    font-size: 11px;
    color: var(--text3);
    line-height: 1.4;
    margin-bottom: 8px;
    padding-left: 0;
  }

  .school-result {
    display: none;
    background: var(--bg);
    border-radius: 6px;
    padding: 8px 10px;
    margin-top: 4px;
  }

  .school-result.show { display: block; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }

  .result-row:last-child { border-bottom: none; }

  .result-label { color: var(--text2); }
  .result-val {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    color: var(--accent2);
  }

  .result-val.time { color: var(--accent); }
  .result-val.err { color: var(--accent3); font-family: 'Noto Sans KR', sans-serif; font-size: 11px; }

  .status-badge {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text3);
    margin-right: 6px;
    flex-shrink: 0;
  }
  .status-badge.loading { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  .status-badge.done { background: var(--accent2); }
  .status-badge.error { background: var(--accent3); }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .kakao-link {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 11px;
    color: var(--accent);
    text-decoration: none;
    transition: all 0.15s;
  }
  .kakao-link:hover { background: var(--surface2); border-color: var(--accent); }

  /* 요약 테이블 */
  .summary-section {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: none;
  }
  .summary-section.show { display: block; }

  .summary-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .summary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }

  .summary-table th {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text3);
    font-weight: 400;
    text-align: left;
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
  }

  .summary-table td {
    padding: 4px 6px;
    border-bottom: 1px solid rgba(48,54,61,0.5);
    vertical-align: middle;
  }

  .summary-table tr:last-child td { border-bottom: none; }

  .summary-table .rank {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text3);
    font-size: 10px;
  }

  .summary-table .sname { font-weight: 500; color: var(--text); }
  .summary-table .dist {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent2);
    font-size: 11px;
  }
  .summary-table .dur {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--accent);
    font-size: 11px;
  }

  .print-btn {
    width: 100%;
    margin-top: 8px;
    padding: 7px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.2s;
  }
  .print-btn:hover { border-color: var(--text2); color: var(--text); }

  /* 지도 */
  .map-area {
    flex: 1;
    position: relative;
    background: var(--bg);
  }

  #map {
    width: 100%;
    height: 100%;
  }

  .map-overlay {
    position: absolute;
    top: 14px; left: 14px;
    background: rgba(13,17,23,0.85);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    color: var(--text2);
    backdrop-filter: blur(4px);
    pointer-events: none;
    z-index: 10;
  }

  .legend-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .legend-row:last-child { margin-bottom: 0; }

  .legend-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* 인쇄 */
  @media print {
    body { background: white; color: black; height: auto; }
    .main { display: block; }
    .map-area { display: none; }
    .sidebar { width: 100%; border: none; height: auto; }
    .calc-btn, .print-btn { display: none; }
    .summary-section { display: block !important; }
    .school-result { display: block !important; background: #f5f5f5; }
    header { background: white; border-bottom: 1px solid #ccc; }
    .header-dot, .map-overlay { display: none; }
    :root { --text: #111; --text2: #444; --text3: #666; --surface: white; --surface2: #f8f8f8; --bg: white; --border: #ddd; --accent: #0066cc; --accent2: #006600; }
  }
</style>
</head>
<body>

<header>
  <div class="header-dot"></div>
  <h1>학교 거리 계산기</h1>
  <div class="header-sub">기준: 경기 수원시 영통구 광교로 145</div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="origin-card">
        <div class="origin-label">📍 기준 주소</div>
        <div class="origin-addr">경기 수원시 영통구 광교로 145</div>
      </div>
      <button class="calc-btn" id="calcBtn" onclick="calculateAll()">
        <span>🗺️ 모든 학교 거리 계산</span>
      </button>
    </div>

    <div class="school-list" id="schoolList"></div>

    <div class="summary-section" id="summarySection">
      <div class="summary-title">📊 거리 순위 (자동차 기준)</div>
      <table class="summary-table" id="summaryTable"></table>
      <button class="print-btn" onclick="window.print()">🖨️ 인쇄</button>
    </div>
  </div>

  <div class="map-area">
    <div id="map"></div>
    <div class="map-overlay">
      <div class="legend-row">
        <div class="legend-dot" style="background:#58a6ff;box-shadow:0 0 6px #58a6ff;"></div>
        <span>기준점 (광교로 145)</span>
      </div>
      <div class="legend-row">
        <div class="legend-dot" style="background:#3fb950;"></div>
        <span>학교</span>
      </div>
    </div>
  </div>
</div>

<script>
const KAKAO_JS_KEY  = 'be59efe600108faa0ba7fdbe71666b4a';
const KAKAO_REST_KEY = 'e32d88b1fe943af2fafd9722f0f54919';

// 기준점
const ORIGIN = {
  name: '광교로 145 (기준)',
  addr: '경기 수원시 영통구 광교로 145',
  lat: 37.2894,
  lng: 127.0436
};

// 학교 목록
const SCHOOLS = [
  { id: 1, name: '수원하이텍고등학교',      addr: '경기도 수원시 영통구 청명북로 56',            lat: 37.2989, lng: 127.0603 },
  { id: 2, name: '수원정보과학고등학교',     addr: '경기도 수원시 영통구 동수원로551번길 16',      lat: 37.2835, lng: 127.0521 },
  { id: 3, name: '삼일공업고등학교',         addr: '경기도 수원시 팔달구 수원천로392번길 44-60',  lat: 37.2731, lng: 127.0152 },
  { id: 4, name: '안양공업고등학교',         addr: '경기도 안양시 만안구 양화로28번길 69',        lat: 37.4026, lng: 126.9176 },
  { id: 5, name: '평택마이스터고등학교',     addr: '경기도 평택시 중앙1로 61',                   lat: 36.9921, lng: 127.0921 },
  { id: 6, name: '이천제일고등학교',         addr: '경기도 이천시 애련정로 26',                   lat: 37.2784, lng: 127.4416 },
  { id: 7, name: '세경고등학교',             addr: '경기도 파주시 파주읍 술이홀로 379',           lat: 37.8269, lng: 126.7703 },
  { id: 8, name: '양영디지털고등학교',       addr: '경기도 성남시 분당구 불정로386번길 35',       lat: 37.3545, lng: 127.1055 },
];

let map = null;
let markers = [];
let polylines = [];
let results = {};

// 학교 카드 렌더링
function renderSchoolCards() {
  const container = document.getElementById('schoolList');
  container.innerHTML = SCHOOLS.map(s => `
    <div class="school-card" id="card-${s.id}" onclick="focusSchool(${s.id})">
      <div class="school-card-header">
        <span class="school-idx">${String(s.id).padStart(2,'0')}</span>
        <span class="school-name">
          <span class="status-badge" id="badge-${s.id}"></span>${s.name}
        </span>
      </div>
      <div class="school-addr">${s.addr}</div>
      <div class="school-result" id="result-${s.id}"></div>
    </div>
  `).join('');
}

// 지도 초기화
function initMap() {
  const script = document.createElement('script');
  script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
  script.onload = () => {
    kakao.maps.load(() => {
      const container = document.getElementById('map');
      map = new kakao.maps.Map(container, {
        center: new kakao.maps.LatLng(ORIGIN.lat, ORIGIN.lng),
        level: 9
      });
      setTimeout(() => { map.relayout(); }, 100);
      addOriginMarker();
      addSchoolMarkers();
    });
  };
  document.head.appendChild(script);
}

// 기준점 마커
function addOriginMarker() {
  const pos = new kakao.maps.LatLng(ORIGIN.lat, ORIGIN.lng);
  const content = `<div style="
    background:#0d1117;border:2px solid #58a6ff;border-radius:8px;
    padding:6px 10px;font-family:'Noto Sans KR',sans-serif;font-size:12px;
    color:#58a6ff;font-weight:700;white-space:nowrap;
    box-shadow:0 0 12px rgba(88,166,255,0.4);">
    ★ 기준점
  </div>`;
  const overlay = new kakao.maps.CustomOverlay({ position: pos, content, yAnchor: 1.3 });
  overlay.setMap(map);

  const circle = new kakao.maps.Circle({
    center: pos, radius: 300,
    strokeWeight: 1, strokeColor: '#58a6ff', strokeOpacity: 0.5,
    fillColor: '#58a6ff', fillOpacity: 0.08
  });
  circle.setMap(map);
}

// 학교 마커
function addSchoolMarkers() {
  SCHOOLS.forEach(s => {
    if (!map) return;
    const pos = new kakao.maps.LatLng(s.lat, s.lng);
    const marker = new kakao.maps.Marker({ position: pos, title: s.name });
    marker.setMap(map);
    markers.push({ id: s.id, marker });
  });
}

// 전체 계산
async function calculateAll() {
  const btn = document.getElementById('calcBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> 계산 중...';

  // 기준점 좌표 정밀 검색
  let originLat = ORIGIN.lat;
  let originLng = ORIGIN.lng;
  try {
    const res = await fetch(
      `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(ORIGIN.addr)}`,
      { headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` } }
    );
    const data = await res.json();
    if (data.documents && data.documents[0]) {
      originLat = parseFloat(data.documents[0].y);
      originLng = parseFloat(data.documents[0].x);
    }
  } catch(e) {}

  // 학교별 좌표 정밀 검색 + 경로 계산 (순차)
  const calcResults = [];

  for (const s of SCHOOLS) {
    setBadge(s.id, 'loading');
    try {
      // 학교 좌표 정밀 검색
      let lat = s.lat, lng = s.lng;
      try {
        const r = await fetch(
          `https://dapi.kakao.com/v2/local/search/address.json?query=${encodeURIComponent(s.addr)}`,
          { headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` } }
        );
        const d = await r.json();
        if (d.documents && d.documents[0]) {
          lat = parseFloat(d.documents[0].y);
          lng = parseFloat(d.documents[0].x);
        }
      } catch(e) {}

      // 직선거리 계산
      const straight = haversine(originLat, originLng, lat, lng);

      // 자동차 경로
      const routeRes = await fetch('https://apis-navi.kakaomobility.com/v1/directions', {
        method: 'GET',
        headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` }
      });

      // GET 방식 경로 API
      const routeUrl = `https://apis-navi.kakaomobility.com/v1/directions?origin=${originLng},${originLat}&destination=${lng},${lat}&priority=RECOMMEND`;
      const routeResp = await fetch(routeUrl, {
        headers: { Authorization: `KakaoAK ${KAKAO_REST_KEY}` }
      });
      const routeData = await routeResp.json();

      let distKm = null, durMin = null, vertexes = [];

      if (routeData.routes && routeData.routes[0] && routeData.routes[0].result_code === 0) {
        const route = routeData.routes[0];
        const summary = route.summary;
        distKm = (summary.distance / 1000).toFixed(1);
        durMin = Math.ceil(summary.duration / 60);

        // 경로 좌표 수집
        (route.sections || []).forEach(sec => {
          (sec.roads || []).forEach(road => {
            const v = road.vertexes || [];
            for (let i = 0; i < v.length; i += 2) {
              vertexes.push(new kakao.maps.LatLng(v[i+1], v[i]));
            }
          });
        });
      }

      const result = { id: s.id, lat, lng, straight: straight.toFixed(1), distKm, durMin, vertexes };
      results[s.id] = result;
      calcResults.push({ s, result });
      renderResult(s, result);
      updateMarkerPosition(s.id, lat, lng);
      drawRoute(s.id, originLat, originLng, lat, lng, vertexes);
      setBadge(s.id, 'done');

    } catch(e) {
      results[s.id] = { error: e.message };
      renderResultError(s, e.message);
      setBadge(s.id, 'error');
    }

    await sleep(300); // API 레이트 리밋 방지
  }

  // 요약 테이블
  renderSummary(calcResults);

  // 지도 전체 보기
  fitBounds(originLat, originLng);

  btn.disabled = false;
  btn.innerHTML = '🔄 다시 계산';
}

// 결과 렌더링
function renderResult(s, r) {
  const el = document.getElementById(`result-${s.id}`);
  const durText = r.durMin !== null ? `${r.durMin}분` : '계산 불가';
  const distText = r.distKm !== null ? `${r.distKm} km` : '계산 불가';
  el.innerHTML = `
    <div class="result-row">
      <span class="result-label">직선거리</span>
      <span class="result-val">${r.straight} km</span>
    </div>
    <div class="result-row">
      <span class="result-label">자동차 거리</span>
      <span class="result-val">${distText}</span>
    </div>
    <div class="result-row">
      <span class="result-label">소요시간</span>
      <span class="result-val time">${durText}</span>
    </div>
    <a class="kakao-link" href="https://map.kakao.com/?q=${encodeURIComponent(s.name + ' ' + s.addr)}" target="_blank">🗺️ 카카오맵에서 보기</a>
  `;
  el.classList.add('show');
}

function renderResultError(s, msg) {
  const el = document.getElementById(`result-${s.id}`);
  el.innerHTML = `<div class="result-row"><span class="result-label">오류</span><span class="result-val err">${msg}</span></div>`;
  el.classList.add('show');
}

// 요약 테이블
function renderSummary(calcResults) {
  const sorted = [...calcResults]
    .filter(({ result }) => result.distKm !== null && result.distKm !== undefined)
    .sort((a, b) => parseFloat(a.result.distKm) - parseFloat(b.result.distKm));

  const table = document.getElementById('summaryTable');
  table.innerHTML = `
    <thead>
      <tr>
        <th>#</th>
        <th>학교명</th>
        <th>거리(km)</th>
        <th>시간(분)</th>
      </tr>
    </thead>
    <tbody>
      ${sorted.map(({ s, result }, idx) => `
        <tr onclick="focusSchool(${s.id})" style="cursor:pointer;">
          <td class="rank">${idx + 1}</td>
          <td class="sname">${s.name}</td>
          <td class="dist">${result.distKm}</td>
          <td class="dur">${result.durMin}</td>
        </tr>
      `).join('')}
    </tbody>
  `;
  document.getElementById('summarySection').classList.add('show');
}

// 지도 관련
function updateMarkerPosition(id, lat, lng) {
  if (!map) return;
  const found = markers.find(m => m.id === id);
  if (found) {
    found.marker.setPosition(new kakao.maps.LatLng(lat, lng));
  }
}

function drawRoute(id, originLat, originLng, lat, lng, vertexes) {
  if (!map) return;
  const path = vertexes.length > 0 ? vertexes : [
    new kakao.maps.LatLng(originLat, originLng),
    new kakao.maps.LatLng(lat, lng)
  ];
  const pl = new kakao.maps.Polyline({
    path,
    strokeWeight: 2,
    strokeColor: '#3fb950',
    strokeOpacity: 0.5,
    strokeStyle: 'solid'
  });
  pl.setMap(map);
  polylines.push({ id, pl });
}

function fitBounds(originLat, originLng) {
  if (!map) return;
  const bounds = new kakao.maps.LatLngBounds();
  bounds.extend(new kakao.maps.LatLng(originLat, originLng));
  markers.forEach(m => bounds.extend(m.marker.getPosition()));
  map.setBounds(bounds);
}

function focusSchool(id) {
  document.querySelectorAll('.school-card').forEach(c => c.classList.remove('active'));
  document.getElementById(`card-${id}`).classList.add('active');
  if (!map) return;
  const found = markers.find(m => m.id === id);
  if (found) {
    map.setCenter(found.marker.getPosition());
    map.setLevel(5);
  }
}

// 배지 상태
function setBadge(id, state) {
  const el = document.getElementById(`badge-${id}`);
  if (el) { el.className = `status-badge ${state}`; }
}

// 하버사인 직선거리 (km)
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 초기화
renderSchoolCards();
window.addEventListener('DOMContentLoaded', initMap);
</script>
