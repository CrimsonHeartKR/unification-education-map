<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 통일교육 체험학습 방문장소 DB</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--navy:#1A3A5C;--blue:#2563EB;--teal:#0D9488;--green:#16A34A;--amber:#D97706;--red:#DC2626;--purple:#7C3AED;--bg:#F0F4F8;--card:#FFFFFF;--border:#CBD5E1;--muted:#64748B;--txt:#1E293B;--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 8px rgba(0,0,0,.06);--shadow-lg:0 4px 16px rgba(0,0,0,.12);--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
.app-header{background:var(--navy);color:#fff;padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.app-header h1{font-size:1.15rem;font-weight:700}
.app-header .sub{font-size:.75rem;opacity:.65;margin-top:2px}
.api-section{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.api-status{font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:600}
.api-ok{background:#16A34A22;color:#16A34A}
.api-wait{background:#D9770622;color:#D97706}
.api-err{background:#DC262622;color:#DC2626}
.data-status{font-size:.7rem;padding:2px 8px;border-radius:10px;font-weight:600}
.layout{display:flex;height:calc(100vh - 60px)}
.sidebar{width:380px;min-width:320px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.map-area{flex:1;position:relative}
#map{width:100%;height:100%}
.map-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#E2E8F0;color:var(--muted);font-size:.95rem;flex-direction:column;gap:.5rem}
.filter-bar{padding:.75rem 1rem;border-bottom:1px solid var(--border);background:#F8FAFC}
.filter-row{display:flex;gap:.5rem;margin-bottom:.5rem;flex-wrap:wrap}
.filter-row:last-child{margin-bottom:0}
.search-input{flex:1;padding:.4rem .7rem;border:1px solid var(--border);border-radius:8px;font-size:.82rem;outline:none;min-width:120px}
.search-input:focus{border-color:var(--blue)}
.filter-select{padding:.4rem .5rem;border:1px solid var(--border);border-radius:8px;font-size:.8rem;background:#fff;cursor:pointer;outline:none}
.stat-bar{display:flex;gap:.5rem;padding:.5rem 1rem;background:#F1F5F9;border-bottom:1px solid var(--border);font-size:.75rem;color:var(--muted);align-items:center;flex-wrap:wrap}
.stat-badge{padding:2px 8px;border-radius:10px;font-weight:600;font-size:.7rem}
.place-list{flex:1;overflow-y:auto;padding:.5rem}
.place-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:.8rem 1rem;margin-bottom:.5rem;cursor:pointer;transition:all .15s}
.place-card:hover{border-color:var(--blue);box-shadow:var(--shadow)}
.place-card.active{border-color:var(--blue);background:#EFF6FF;box-shadow:var(--shadow)}
.place-name{font-weight:700;font-size:.92rem;margin-bottom:4px;display:flex;align-items:center;gap:.4rem}
.place-addr{font-size:.78rem;color:var(--muted);margin-bottom:4px}
.place-tags{display:flex;gap:.3rem;flex-wrap:wrap}
.tag{padding:2px 7px;border-radius:6px;font-size:.68rem;font-weight:600}
.tag-unity{background:#DBEAFE;color:#1D4ED8}
.tag-indep{background:#FEF3C7;color:#92400E}
.tag-war{background:#FEE2E2;color:#991B1B}
.tag-history{background:#D1FAE5;color:#065F46}
.tag-eco{background:#E0E7FF;color:#4338CA}
.detail-panel{display:none;position:absolute;top:10px;right:10px;width:360px;max-height:calc(100% - 20px);background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:100;overflow-y:auto}
.detail-panel.show{display:block}
.detail-header{padding:1rem;border-bottom:1px solid var(--border)}
.detail-close{float:right;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--muted)}
.detail-close:hover{color:var(--txt)}
.detail-title{font-size:1.05rem;font-weight:700;margin-bottom:.3rem}
.detail-body{padding:1rem}
.detail-row{display:flex;gap:.5rem;margin-bottom:.6rem;font-size:.82rem}
.detail-label{font-weight:600;min-width:70px;color:var(--muted)}
.detail-value{flex:1}
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:1rem}
.loading-spinner{width:40px;height:40px;border:4px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reload-btn{padding:6px 16px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:.78rem;cursor:pointer;font-weight:600}
.reload-btn:hover{opacity:.9}
@media(max-width:768px){.layout{flex-direction:column;height:auto}.sidebar{width:100%;max-height:50vh}.map-area{height:50vh}.detail-panel{width:calc(100% - 20px)}.app-header{padding:.75rem 1rem}}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
<div class="loading-spinner"></div>
<div style="font-size:.9rem;color:var(--muted)">구글 스프레드시트에서 데이터를 불러오는 중...</div>
</div>
<header class="app-header">
<div>
<h1>2026 통일교육 체험학습 방문장소 DB</h1>
<div class="sub">서울특별시교육청 학교통일교육 프로그램 | KAC 고려아카데미컨설팅</div>
</div>
<div class="api-section">
<span id="dataStatus" class="data-status api-wait">데이터 로딩중...</span>
<span id="apiStatus" class="api-status api-wait">지도 로딩중...</span>
<button class="reload-btn" onclick="loadSheetData()" title="스프레드시트 데이터 새로고침">↻ 새로고침</button>
</div>
</header>
<div class="layout">
<aside class="sidebar">
<div class="filter-bar">
<div class="filter-row">
<input type="text" id="searchInput" class="search-input" placeholder="장소명 검색...">
</div>
<div class="filter-row">
<select id="regionFilter" class="filter-select"><option value="">전체 지역</option></select>
<select id="categoryFilter" class="filter-select">
<option value="">전체 카테고리</option>
<option value="통일·안보">통일·안보</option>
<option value="독립·민주화">독립·민주화</option>
<option value="전쟁·호국">전쟁·호국</option>
<option value="역사·문화">역사·문화</option>
<option value="생태·평화">생태·평화</option>
</select>
<select id="targetFilter" class="filter-select">
<option value="">전체 대상</option>
<option value="초">초등</option>
<option value="중">중등</option>
<option value="고">고등</option>
</select>
</div>
</div>
<div class="stat-bar">
<span id="statTotal"></span>
<span id="statFiltered"></span>
<span id="statUpdate" style="margin-left:auto;font-size:.65rem;color:#94A3B8"></span>
</div>
<div class="place-list" id="placeList"></div>
</aside>
<div class="map-area">
<div id="map">
<div class="map-placeholder" id="mapPlaceholder">
<div style="font-size:2rem">🗺️</div>
<div>지도를 불러오는 중입니다...</div>
</div>
</div>
<div class="detail-panel" id="detailPanel">
<div class="detail-header">
<button class="detail-close" onclick="closeDetail()">✕</button>
<div class="detail-title" id="detailTitle"></div>
<div class="place-tags" id="detailTags"></div>
</div>
<div class="detail-body" id="detailBody"></div>
</div>
</div>
</div>
<script>
/* ===== 구글 스프레드시트 CSV 연동 설정 ===== */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQy9GCEFg-htvt1PezHip-QDBTgCgwDfH-PzlhUwcq-wiELcsBMWMWdVgOLj5rFl9qeahFBejwGg7rX/pub?gid=389612217&single=true&output=csv';
const KAKAO_API_KEY = 'be59efe600108faa0ba7fdbe71666b4a';

let PLACES = [];
let kakaoLoaded = false;
let map = null;
let markers = [];
let infoWindows = [];
let activePlace = null;

/* ===== CSV 데이터 로드 ===== */
function loadSheetData() {
  document.getElementById('dataStatus').className = 'data-status api-wait';
  document.getElementById('dataStatus').textContent = '데이터 로딩중...';

  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      PLACES = results.data
        .filter(row => row['ID'] && row['장소명'] && row['위도'] && row['경도'])
        .map(row => ({
          id: parseInt(row['ID']) || 0,
          name: (row['장소명'] || '').trim(),
          region: (row['지역'] || '').trim(),
          category: (row['카테고리'] || '').trim(),
          target: (row['대상'] || '').trim(),
          addr: (row['주소'] || '').trim(),
          lat: parseFloat(row['위도']) || 0,
          lng: parseFloat(row['경도']) || 0,
          tel: (row['전화번호'] || '').trim(),
          desc: (row['설명'] || '').trim(),
          hours: (row['운영시간'] || '').trim(),
          closed: (row['휴관일'] || '').trim(),
          fee: (row['입장료'] || '').trim(),
          parking: (row['주차'] || '').trim(),
          booking: (row['예약'] || '').trim(),
          url: (row['홈페이지'] || '').trim()
        }));

      document.getElementById('dataStatus').className = 'data-status api-ok';
      document.getElementById('dataStatus').textContent = 'DB ' + PLACES.length + '개소';
      document.getElementById('statUpdate').textContent = '최종 갱신: ' + new Date().toLocaleString('ko-KR');
      document.getElementById('loadingOverlay').style.display = 'none';

      populateRegionFilter();
      renderList();
    },
    error: function(err) {
      document.getElementById('dataStatus').className = 'data-status api-err';
      document.getElementById('dataStatus').textContent = '데이터 로드 실패';
      document.getElementById('loadingOverlay').innerHTML = '<div style="text-align:center"><div style="font-size:2rem;margin-bottom:1rem">⚠️</div><div style="font-size:.9rem;color:#DC2626;margin-bottom:.5rem">스프레드시트 데이터를 불러오지 못했습니다</div><div style="font-size:.78rem;color:#64748B;margin-bottom:1rem">네트워크 연결을 확인해주세요</div><button class="reload-btn" onclick="location.reload()">다시 시도</button></div>';
      console.error('CSV load error:', err);
    }
  });
}

/* ===== 초기화 ===== */
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('regionFilter').addEventListener('change', renderList);
  document.getElementById('categoryFilter').addEventListener('change', renderList);
  document.getElementById('targetFilter').addEventListener('change', renderList);
  loadSheetData();
  initKakaoMap();
});

/* ===== 필터 ===== */
function populateRegionFilter() {
  var regions = [];
  var seen = {};
  PLACES.forEach(function(p) {
    if (p.region && !seen[p.region]) { seen[p.region] = true; regions.push(p.region); }
  });
  regions.sort();
  var sel = document.getElementById('regionFilter');
  var current = sel.value;
  sel.innerHTML = '<option value="">전체 지역</option>';
  regions.forEach(function(r) {
    var opt = document.createElement('option');
    opt.value = r;
    opt.textContent = r;
    sel.appendChild(opt);
  });
  sel.value = current;
}

function getFiltered() {
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  var region = document.getElementById('regionFilter').value;
  var category = document.getElementById('categoryFilter').value;
  var target = document.getElementById('targetFilter').value;
  return PLACES.filter(function(p) {
    if (q && p.name.toLowerCase().indexOf(q) === -1 && p.addr.toLowerCase().indexOf(q) === -1 && p.desc.toLowerCase().indexOf(q) === -1) return false;
    if (region && p.region !== region) return false;
    if (category && p.category !== category) return false;
    if (target && p.target.indexOf(target) === -1) return false;
    return true;
  });
}

function getCategoryTag(cat) {
  var m = {'통일·안보':'tag-unity','독립·민주화':'tag-indep','전쟁·호국':'tag-war','역사·문화':'tag-history','생태·평화':'tag-eco'};
  return m[cat] || 'tag-history';
}

/* ===== 목록 렌더링 ===== */
function renderList() {
  var filtered = getFiltered();
  var listEl = document.getElementById('placeList');
  var total = PLACES.length;
  document.getElementById('statTotal').textContent = '전체 ' + total + '개소';
  document.getElementById('statFiltered').innerHTML = filtered.length < total
    ? '<span class="stat-badge" style="background:#DBEAFE;color:#1D4ED8">필터 결과: ' + filtered.length + '개</span>' : '';
  var html = '';
  filtered.forEach(function(p) {
    html += '<div class="place-card ' + (activePlace===p.id?'active':'') + '" onclick="selectPlace(' + p.id + ')" id="card-' + p.id + '">' +
      '<div class="place-name"><span class="tag ' + getCategoryTag(p.category) + '">' + p.category + '</span> ' + p.name + '</div>' +
      '<div class="place-addr">' + p.addr + '</div>' +
      '<div class="place-tags">' +
        '<span class="tag" style="background:#F1F5F9;color:#475569">' + p.region + '</span>' +
        '<span class="tag" style="background:#F0FDF4;color:#166534">' + p.target + '</span>' +
        (p.fee==='무료'?'<span class="tag" style="background:#ECFDF5;color:#059669">무료</span>':'') +
      '</div></div>';
  });
  listEl.innerHTML = html;
  if (kakaoLoaded && map) updateMarkers(filtered);
}

/* ===== 장소 선택 ===== */
function selectPlace(id) {
  activePlace = id;
  var p = null;
  for (var i = 0; i < PLACES.length; i++) { if (PLACES[i].id === id) { p = PLACES[i]; break; } }
  if (!p) return;
  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailTags').innerHTML =
    '<span class="tag ' + getCategoryTag(p.category) + '">' + p.category + '</span>' +
    '<span class="tag" style="background:#F1F5F9;color:#475569">' + p.region + '</span>' +
    '<span class="tag" style="background:#F0FDF4;color:#166534">' + p.target + '</span>';
  var body = '<div class="detail-row"><div class="detail-label">설명</div><div class="detail-value">' + p.desc + '</div></div>' +
    '<div class="detail-row"><div class="detail-label">주소</div><div class="detail-value">' + p.addr + '</div></div>';
  if (p.tel) body += '<div class="detail-row"><div class="detail-label">전화</div><div class="detail-value"><a href="tel:' + p.tel + '">' + p.tel + '</a></div></div>';
  if (p.hours) body += '<div class="detail-row"><div class="detail-label">운영시간</div><div class="detail-value">' + p.hours + '</div></div>';
  if (p.closed) body += '<div class="detail-row"><div class="detail-label">휴관일</div><div class="detail-value">' + p.closed + '</div></div>';
  if (p.fee) body += '<div class="detail-row"><div class="detail-label">입장료</div><div class="detail-value">' + p.fee + '</div></div>';
  if (p.parking) body += '<div class="detail-row"><div class="detail-label">주차</div><div class="detail-value">' + p.parking + '</div></div>';
  if (p.booking) body += '<div class="detail-row"><div class="detail-label">예약</div><div class="detail-value">' + p.booking + '</div></div>';
  if (p.url) body += '<div class="detail-row"><div class="detail-label">홈페이지</div><div class="detail-value"><a href="' + p.url + '" target="_blank">' + p.url + '</a></div></div>';
  body += '<div style="margin-top:.8rem"><a href="https://map.kakao.com/link/to/' + encodeURIComponent(p.name) + ',' + p.lat + ',' + p.lng + '" target="_blank" style="display:block;text-align:center;padding:.5rem;background:#FEE500;color:#191919;border-radius:8px;text-decoration:none;font-size:.82rem;font-weight:600">카카오맵에서 보기</a></div>';
  document.getElementById('detailBody').innerHTML = body;
  document.getElementById('detailPanel').classList.add('show');
  var cards = document.querySelectorAll('.place-card');
  for (var j = 0; j < cards.length; j++) cards[j].classList.remove('active');
  var card = document.getElementById('card-' + id);
  if (card) { card.classList.add('active'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  if (kakaoLoaded && map) { map.setCenter(new kakao.maps.LatLng(p.lat,p.lng)); map.setLevel(4); }
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
  activePlace = null;
  var cards = document.querySelectorAll('.place-card');
  for (var i = 0; i < cards.length; i++) cards[i].classList.remove('active');
}

/* ===== 카카오맵 ===== */
function initKakaoMap() {
  var script = document.createElement('script');
  script.src = '//dapi.kakao.com/v2/maps/sdk.js?appkey=' + KAKAO_API_KEY + '&autoload=false';
  script.onload = function() {
    kakao.maps.load(function() {
      kakaoLoaded = true;
      document.getElementById('mapPlaceholder').style.display = 'none';
      document.getElementById('apiStatus').className = 'api-status api-ok';
      document.getElementById('apiStatus').textContent = '지도 연결됨';
      var container = document.getElementById('map');
      map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.56,126.98), level: 10 });
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);
      if (PLACES.length > 0) updateMarkers(getFiltered());
    });
  };
  script.onerror = function() {
    document.getElementById('apiStatus').className = 'api-status api-err';
    document.getElementById('apiStatus').textContent = '지도 로드 실패';
    document.getElementById('mapPlaceholder').innerHTML = '<div style="font-size:2rem">⚠️</div><div>카카오맵 로드에 실패했습니다</div><div style="font-size:.78rem">developers.kakao.com에서 JavaScript SDK 도메인 등록을 확인해주세요</div>';
  };
  document.head.appendChild(script);
}

/* ===== 마커 업데이트 ===== */
function updateMarkers(filtered) {
  markers.forEach(function(m) { m.setMap(null); });
  infoWindows.forEach(function(iw) { iw.close(); });
  markers = [];
  infoWindows = [];
  var catColors = {'통일·안보':'#2563EB','독립·민주화':'#D97706','전쟁·호국':'#DC2626','역사·문화':'#16A34A','생태·평화':'#7C3AED'};
  var bounds = new kakao.maps.LatLngBounds();
  filtered.forEach(function(p) {
    if (!p.lat || !p.lng) return;
    var pos = new kakao.maps.LatLng(p.lat, p.lng);
    bounds.extend(pos);
    var color = catColors[p.category] || '#475569';
    var markerImage = new kakao.maps.MarkerImage(
      'https://chart.googleapis.com/chart?chst=d_map_pin_letter&chld=' + encodeURIComponent(p.name[0]) + '|' + color.replace('#','') + '|FFFFFF',
      new kakao.maps.Size(21, 34)
    );
    var marker = new kakao.maps.Marker({ position: pos, map: map, title: p.name, image: markerImage });
    var iwContent = '<div style="padding:8px 12px;font-size:13px;max-width:220px;line-height:1.4"><strong>' + p.name + '</strong><br><span style="color:#64748B;font-size:11px">' + p.category + ' · ' + p.region + '</span><br><span style="font-size:11px;color:#475569">' + p.addr + '</span></div>';
    var infoWindow = new kakao.maps.InfoWindow({ content: iwContent });
    (function(mk, iw, place) {
      kakao.maps.event.addListener(mk, 'click', function() {
        infoWindows.forEach(function(w) { w.close(); });
        iw.open(map, mk);
        selectPlace(place.id);
      });
      kakao.maps.event.addListener(mk, 'mouseover', function() { iw.open(map, mk); });
      kakao.maps.event.addListener(mk, 'mouseout', function() { if (activePlace !== place.id) iw.close(); });
    })(marker, infoWindow, p);
    markers.push(marker);
    infoWindows.push(infoWindow);
  });
  if (filtered.length > 0) map.setBounds(bounds);
}
</script>
</body>
</html>
