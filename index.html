body { font-family: 'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif; background: var(--bg); color: var(--txt); min-height: 100vh; }

.layout { display: flex; height: calc(100vh - 60px); }
.sidebar { width: 380px; min-width: 320px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

.search-input { flex: 1; padding: .4rem .7rem; border: 1px solid var(--border); border-radius: 8px; font-size: .82rem; outline: none; min-width: 120px; }

.stat-badge { padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: .7rem; }
.place-list { flex: 1; overflow-y: auto; padding: .5rem; }

.place-card:hover { border-color: var(--blue); box-shadow: var(--shadow); }
.place-card.active { border-color: var(--blue); background: #EFF6FF; box-shadow: var(--shadow); }
.place-name { font-weight: 700; font-size: .92rem; margin-bottom: 4px; display: flex; align-items: center; gap: .4rem; }
.place-addr { font-size: .78rem; color: var(--muted); margin-bottom: 4px; }
.place-tags { display: flex; gap: .3rem; flex-wrap: wrap; }
.tag { padding: 2px 7px; border-radius: 6px; font-size: .68rem; font-weight: 600; }
.tag-unity { background: #DBEAFE; color: #1D4ED8; }
.tag-indep { background: #FEF3C7; color: #92400E; }
.tag-war { background: #FEE2E2; color: #991B1B; }
.tag-history { background: #D1FAE5; color: #065F46; }
.tag-eco { background: #E0E7FF; color: #4338CA; }
.detail-panel { display: none; position: absolute; top: 10px; right: 10px; width: 360px; max-height: calc(100% - 20px); background: var(--card); border-radius: var(--r); box-shadow: var(--shadow-lg); z-index: 100; overflow-y: auto; }
.detail-panel.show { display: block; }
.detail-header { padding: 1rem; border-bottom: 1px solid var(--border); }
.detail-close { float: right; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--muted); }
.detail-close:hover { color: var(--txt); }
.detail-title { font-size: 1.05rem; font-weight: 700; margin-bottom: .3rem; }
.detail-body { padding: 1rem; }
.detail-row { display: flex; gap: .5rem; margin-bottom: .6rem; font-size: .82rem; }
.detail-label { font-weight: 600; min-width: 70px; color: var(--muted); }
.detail-value { flex: 1; }
@media (max-width: 768px) {

let kakaoLoaded = false;
let map = null;
let markers = [];
let infoWindows = [];
let activePlace = null;

document.addEventListener('DOMContentLoaded', () => {
  populateRegionFilter();
  renderList();
  document.getElementById('searchInput').addEventListener('input', renderList);
  document.getElementById('regionFilter').addEventListener('change', renderList);
  document.getElementById('categoryFilter').addEventListener('change', renderList);
  document.getElementById('targetFilter').addEventListener('change', renderList);
  initKakaoMap();
});

function populateRegionFilter() {
  const regions = [...new Set(PLACES.map(p => p.region))].sort();
  const sel = document.getElementById('regionFilter');
  regions.forEach(r => { const opt = document.createElement('option'); opt.value = r; opt.textContent = r; sel.appendChild(opt); });
}

function getFiltered() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const region = document.getElementById('regionFilter').value;
  const category = document.getElementById('categoryFilter').value;
  const target = document.getElementById('targetFilter').value;
  return PLACES.filter(p => {
    if (q && !p.name.toLowerCase().includes(q) && !p.addr.toLowerCase().includes(q) && !p.desc.toLowerCase().includes(q)) return false;
    if (region && p.region !== region) return false;
    if (category && p.category !== category) return false;
    if (target && !p.target.includes(target)) return false;
    return true;
  });
}

function getCategoryTag(cat) {
  const m = {'통일·안보':'tag-unity','독립·민주화':'tag-indep','전쟁·호국':'tag-war','역사·문화':'tag-history','생태·평화':'tag-eco'};
  return m[cat] || 'tag-history';
}

function renderList() {
  const filtered = getFiltered();
  const listEl = document.getElementById('placeList');
  const total = PLACES.length;
  document.getElementById('statTotal').textContent = `전체 ${total}개소`;
  document.getElementById('statFiltered').innerHTML = filtered.length < total ? `<span class="stat-badge" style="background:#DBEAFE;color:#1D4ED8">필터 결과: ${filtered.length}개</span>` : '';
  listEl.innerHTML = filtered.map(p => `
    <div class="place-card ${activePlace === p.id ? 'active' : ''}" onclick="selectPlace(${p.id})" id="card-${p.id}">
      <div class="place-name"><span class="tag ${getCategoryTag(p.category)}">${p.category}</span> ${p.name}</div>
      <div class="place-addr">${p.addr}</div>
      <div class="place-tags">
        <span class="tag" style="background:#F1F5F9;color:#475569">${p.region}</span>
        <span class="tag" style="background:#F0FDF4;color:#166534">${p.target}</span>
        ${p.fee === '무료' ? '<span class="tag" style="background:#ECFDF5;color:#059669">무료</span>' : ''}
      </div>
    </div>
  `).join('');
  if (kakaoLoaded && map) updateMarkers(filtered);
}

function selectPlace(id) {
  activePlace = id;
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  document.getElementById('detailTitle').textContent = p.name;
  document.getElementById('detailTags').innerHTML = `
    <span class="tag ${getCategoryTag(p.category)}">${p.category}</span>
    <span class="tag" style="background:#F1F5F9;color:#475569">${p.region}</span>
    <span class="tag" style="background:#F0FDF4;color:#166534">${p.target}</span>
  `;
  document.getElementById('detailBody').innerHTML = `
    <div class="detail-row"><div class="detail-label">설명</div><div class="detail-value">${p.desc}</div></div>
    <div class="detail-row"><div class="detail-label">주소</div><div class="detail-value">${p.addr}</div></div>
    ${p.tel ? `<div class="detail-row"><div class="detail-label">전화</div><div class="detail-value"><a href="tel:${p.tel}">${p.tel}</a></div></div>` : ''}
    ${p.hours ? `<div class="detail-row"><div class="detail-label">운영시간</div><div class="detail-value">${p.hours}</div></div>` : ''}
    ${p.closed ? `<div class="detail-row"><div class="detail-label">휴관일</div><div class="detail-value">${p.closed}</div></div>` : ''}
    ${p.fee ? `<div class="detail-row"><div class="detail-label">입장료</div><div class="detail-value">${p.fee}</div></div>` : ''}
    ${p.parking ? `<div class="detail-row"><div class="detail-label">주차</div><div class="detail-value">${p.parking}</div></div>` : ''}
    ${p.booking ? `<div class="detail-row"><div class="detail-label">예약</div><div class="detail-value">${p.booking}</div></div>` : ''}
    ${p.url ? `<div class="detail-row"><div class="detail-label">홈페이지</div><div class="detail-value"><a href="${p.url}" target="_blank">${p.url}</a></div></div>` : ''}
    <div style="margin-top:.8rem;">
      <a href="https://map.kakao.com/link/to/${encodeURIComponent(p.name)},${p.lat},${p.lng}" target="_blank" style="display:block;text-align:center;padding:.5rem;background:#FEE500;color:#191919;border-radius:8px;text-decoration:none;font-size:.82rem;font-weight:600">카카오맵에서 보기</a>
    </div>
  `;
  document.getElementById('detailPanel').classList.add('show');
  document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
  const card = document.getElementById(`card-${id}`);
  if (card) { card.classList.add('active'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  if (kakaoLoaded && map) { map.setCenter(new kakao.maps.LatLng(p.lat, p.lng)); map.setLevel(4); }
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('show');
  activePlace = null;
  document.querySelectorAll('.place-card').forEach(c => c.classList.remove('active'));
}

function initKakaoMap() {
  const key = 'be59efe600108faa0ba7fdbe71666b4a';
  const script = document.createElement('script');
  script.src = `//dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false`;
  script.onload = () => {
    kakao.maps.load(() => {
      kakaoLoaded = true;
      document.getElementById('mapPlaceholder').style.display = 'none';
      document.getElementById('apiStatus').className = 'api-status api-ok';
      document.getElementById('apiStatus').textContent = '지도 연결됨';
      const container = document.getElementById('map');
      map = new kakao.maps.Map(container, { center: new kakao.maps.LatLng(37.56, 126.98), level: 10 });
      map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
      map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPRIGHT);
      updateMarkers(getFiltered());
    });
  };
  script.onerror = () => {
    document.getElementById('apiStatus').className = 'api-status api-wait';
    document.getElementById('apiStatus').textContent = '지도 로드 실패';
    document.getElementById('mapPlaceholder').innerHTML = '<div style="font-size:2rem">⚠️</div><div>카카오맵 로드에 실패했습니다</div><div style="font-size:.78rem">developers.kakao.com에서 JavaScript SDK 도메인 등록을 확인해주세요</div>';
  };
  document.head.appendChild(script);
}

function updateMarkers(filtered) {
  markers.forEach(m => m.setMap(null));
  infoWindows.forEach(iw => iw.close());
  markers = [];
  infoWindows = [];
  const catColors = {'통일·안보':'#2563EB','독립·민주화':'#D97706','전쟁·호국':'#DC2626','역사·문화':'#16A34A','생태·평화':'#7C3AED'};
  const bounds = new kakao.maps.LatLngBounds();
  filtered.forEach(p => {
    const pos = new kakao.maps.LatLng(p.lat, p.lng);
    bounds.extend(pos);
    const color = catColors[p.category] || '#475569';
    const markerImage = new kakao.maps.MarkerImage(
      `https://chart.googleapis.com/chart?chst=d_map_pin_letter&chld=${encodeURIComponent(p.name[0])}|${color.replace('#','')}|FFFFFF`,
      new kakao.maps.Size(21, 34)
    );
    const marker = new kakao.maps.Marker({ position: pos, map: map, title: p.name, image: markerImage });
    const iwContent = `<div style="padding:8px 12px;font-size:13px;max-width:220px;line-height:1.4"><strong>${p.name}</strong><br><span style="color:#64748B;font-size:11px">${p.category} · ${p.region}</span><br><span style="font-size:11px;color:#475569">${p.addr}</span></div>`;
    const infoWindow = new kakao.maps.InfoWindow({ content: iwContent });
    kakao.maps.event.addListener(marker, 'click', () => { infoWindows.forEach(iw => iw.close()); infoWindow.open(map, marker); selectPlace(p.id); });
    kakao.maps.event.addListener(marker, 'mouseover', () => infoWindow.open(map, marker));
    kakao.maps.event.addListener(marker, 'mouseout', () => { if (activePlace !== p.id) infoWindow.close(); });
    markers.push(marker);
    infoWindows.push(infoWindow);
  });
  if (filtered.length > 0) map.setBounds(bounds);
}
</script>
</body>
</html>
