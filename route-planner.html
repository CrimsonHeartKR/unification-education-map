<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통일교육 동선 자동화 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #F0F4F8;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 헤더 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background-color: #1A3A5C;
            color: white;
            padding: 12px 20px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .api-keys {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .api-input {
            padding: 6px 10px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            width: 200px;
            font-family: 'Courier New', monospace;
        }

        .api-input::placeholder {
            color: #999;
        }

        /* 왼쪽 패널 */
        .left-panel {
            width: 420px;
            background: white;
            overflow-y: auto;
            margin-top: 50px;
            box-shadow: 2px 0 8px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid #E0E8F0;
        }

        .panel-section h2 {
            font-size: 14px;
            font-weight: 600;
            color: #1A3A5C;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #D0D8E0;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1A3A5C;
            box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #D0D8E0;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
        }

        .search-results.show {
            display: block;
        }

        .search-result-item {
            padding: 10px;
            border-bottom: 1px solid #E8EEF5;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.2s;
        }

        .search-result-item:hover {
            background-color: #F0F4F8;
        }

        .search-result-item .place-name {
            font-weight: 500;
            color: #1A3A5C;
        }

        .search-result-item .place-addr {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        }

        .btn-primary {
            background-color: #1A3A5C;
            color: white;
            width: 100%;
            margin-top: 8px;
        }

        .btn-primary:hover {
            background-color: #0F2436;
        }

        .btn-primary:disabled {
            background-color: #C0C8D0;
            cursor: not-allowed;
        }

        .btn-secondary {
            background-color: #E0E8F0;
            color: #1A3A5C;
            margin-top: 8px;
        }

        .btn-secondary:hover {
            background-color: #D0D8E0;
        }

        .btn-print {
            background-color: #4A7BA7;
            color: white;
            margin-top: 8px;
        }

        .btn-print:hover {
            background-color: #365F8A;
        }

        .selected-school {
            background-color: #F0F4F8;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #1A3A5C;
            margin-top: 8px;
            font-size: 12px;
        }

        .selected-school .label {
            color: #888;
            font-size: 11px;
        }

        .selected-school .value {
            font-weight: 500;
            margin-top: 2px;
        }

        .destination-group {
            background-color: #F8FAFC;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            border: 1px solid #E0E8F0;
        }

        .destination-group h4 {
            font-size: 12px;
            font-weight: 600;
            color: #1A3A5C;
            margin-bottom: 8px;
        }

        .destination-item {
            padding: 8px;
            background: white;
            border-radius: 3px;
            margin-bottom: 6px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .destination-item .name {
            font-weight: 500;
        }

        .destination-item .stay {
            font-size: 11px;
            color: #888;
        }

        .route-results {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .route-summary {
            background: white;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }

        .route-summary.show {
            display: block;
        }

        .route-segment {
            padding: 12px;
            background: #F8FAFC;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 4px solid #4A7BA7;
            font-size: 12px;
        }

        .route-segment .from-to {
            font-weight: 500;
            color: #1A3A5C;
            margin-bottom: 6px;
        }

        .route-segment .details {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 11px;
        }

        .schedule-container {
            background: white;
            padding: 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: none;
        }

        .schedule-container.show {
            display: block;
        }

        .schedule-title {
            font-weight: 600;
            color: #1A3A5C;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline-item {
            margin-bottom: 16px;
            font-size: 12px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #1A3A5C;
            border: 3px solid white;
            box-shadow: 0 0 0 2px #1A3A5C;
        }

        .timeline-item.arrive::before {
            background: #4A7BA7;
        }

        .timeline-item.depart::before {
            background: #8BA7C8;
        }

        .timeline-item .time {
            font-weight: 600;
            color: #1A3A5C;
            font-size: 13px;
        }

        .timeline-item .event {
            color: #555;
            margin-top: 2px;
        }

        .warnings {
            background: #FFF3CD;
            border: 1px solid #FFE69C;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 16px;
            display: none;
        }

        .warnings.show {
            display: block;
        }

        .warnings h3 {
            font-size: 12px;
            color: #856404;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .warnings ul {
            font-size: 12px;
            color: #856404;
            margin-left: 16px;
        }

        .warnings li {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        /* 오른쪽 영역 */
        .right-area {
            flex: 1;
            margin-top: 50px;
            display: flex;
            flex-direction: column;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #F0F4F8;
            display: none;
        }

        .map-fallback {
            width: 100%;
            height: 100%;
            background: #F0F4F8;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }

        .map-fallback.show {
            display: flex;
        }

        .map-fallback p {
            margin-bottom: 16px;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            background: white;
            border-bottom: 1px solid #E0E8F0;
            order: -1;
        }

        .tab-btn {
            padding: 8px 16px;
            background: #F0F4F8;
            color: #666;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .tab-btn.active {
            background: #1A3A5C;
            color: white;
        }

        .tab-content {
            display: none;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        .text-mode {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .course-info {
            background: white;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .course-info h3 {
            font-size: 13px;
            color: #1A3A5C;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .course-info p {
            font-size: 12px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .course-meta {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: #888;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #E0E8F0;
        }

        .route-info {
            background: white;
            padding: 16px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 16px;
        }

        .route-info h4 {
            font-size: 12px;
            color: #1A3A5C;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .route-leg {
            padding: 10px 0;
            border-bottom: 1px solid #E0E8F0;
            font-size: 12px;
        }

        .route-leg:last-child {
            border-bottom: none;
        }

        .route-leg .distance {
            color: #4A7BA7;
            font-weight: 600;
        }

        .route-leg .time {
            color: #888;
            font-size: 11px;
        }

        @media print {
            body {
                background: white;
            }

            .container {
                height: auto;
            }

            .left-panel {
                display: none;
            }

            .right-area {
                margin-top: 0;
                width: 100%;
            }

            #map {
                display: none !important;
            }

            .map-fallback {
                display: none !important;
            }

            .tab-buttons {
                display: none;
            }

            header {
                position: static;
            }

            .tab-content {
                display: block !important;
            }

            .print-hide {
                display: none;
            }
        }

        .error-message {
            background: #F8D7DA;
            border: 1px solid #F5C6CB;
            color: #721C24;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #D4EDDA;
            border: 1px solid #C3E6CB;
            color: #155724;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 12px;
            font-size: 12px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 12px;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #E0E8F0;
            border-top: 2px solid #1A3A5C;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-map-warning {
            background: #FFF3CD;
            border: 1px solid #FFE69C;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #856404;
        }

        .place-warning {
            background: #FFE8E8;
            border: 1px solid #FFD0D0;
            color: #C33;
            padding: 8px;
            border-radius: 3px;
            margin-top: 4px;
            font-size: 11px;
        }

        @media (max-width: 1024px) {
            .left-panel {
                width: 360px;
            }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-panel {
                width: 100%;
                height: 50%;
            }

            .right-area {
                width: 100%;
                height: 50%;
                margin-top: 0;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px;
                gap: 10px;
            }

            .api-keys {
                width: 100%;
                flex-direction: column;
            }

            .api-input {
                width: 100%;
            }

            header h1 {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>통일교육 동선 자동화 시스템</h1>
    </header>
    <script>
        // 카카오 API 키 (하드코딩) - JS키는 도메인 제한, REST키는 내부용
        const KAKAO_JS_KEY = 'be59efe600108faa0ba7fdbe71666b4a';
        const KAKAO_REST_KEY = 'e32d88b1fe943af2fafd9722f0f54919';
    </script>

    <div class="container">
        <div class="left-panel">
            <div class="panel-section">
                <h2>학교 검색</h2>
                <div class="form-group">
                    <label>학교명 또는 주소</label>
                    <input type="text" id="schoolSearch" placeholder="예: 서울시 강남구 테헤란로">
                </div>
                <div id="schoolResults" class="search-results"></div>
                <div id="selectedSchool" class="selected-school" style="display: none;">
                    <div class="label">선택된 학교</div>
                    <div class="value" id="schoolName"></div>
                    <div class="value" style="font-size: 11px; margin-top: 4px;" id="schoolAddr"></div>
                </div>
            </div>

            <div class="panel-section">
                <h2>코스 선택</h2>
                <div class="form-group">
                    <label>코스명</label>
                    <select id="courseSelect">
                        <option value="">-- 코스를 선택하세요 --</option>
                        <optgroup label="서울 코스">
                            <option value="S-01">S-01 | 전쟁과 평화, 독립의 길</option>
                            <option value="S-02">S-02 | 안중근의 하얼빈, 남산에서 만나다</option>
                            <option value="S-03">S-03 | 독립문에서 임정까지, 자유의 발자국</option>
                            <option value="S-04">S-04 | 광화문 역사 거리, 대한민국을 걷다</option>
                            <option value="S-05">S-05 | 민주의 불꽃, 4월의 현장</option>
                            <option value="S-06">S-06 | 조국을 위한 헌신, 현충원의 울림</option>
                            <option value="S-07">S-07 | 육사의 정신, 호국의 길</option>
                        </optgroup>
                        <optgroup label="경기 코스">
                            <option value="G-01">G-01 | 분단선에 서다 — DMZ 평화 탐방</option>
                            <option value="G-02">G-02 | 평화의 철길 — 도라산역과 임진강</option>
                            <option value="G-03">G-03 | 캠프그리브스에서 평화를 캐다</option>
                            <option value="G-04">G-04 | DMZ 생태와 역사, 두 얼굴의 접경</option>
                            <option value="G-05">G-05 | 전곡선사에서 평화의 길로</option>
                            <option value="G-06">G-06 | 애기봉에서 바라보는 북녘 땅</option>
                            <option value="G-07">G-07 | 행주대첩과 통일대교</option>
                            <option value="G-08">G-08 | 정조의 꿈, 실학으로 통일을 상상하다</option>
                            <option value="G-09">G-09 | 남한산성의 항쟁, 그리고 우리의 선택</option>
                            <option value="G-10">G-10 | 한민속촌 — 남북 전통문화 비교</option>
                            <option value="G-11">G-11 | 다산의 실학에서 하남 삼국까지</option>
                            <option value="G-12">G-12 | 세종대왕의 나라, 한글로 통일을 말하다</option>
                            <option value="G-13">G-13 | 3·1의 함성과 6·25의 전장</option>
                            <option value="G-14">G-14 | 일제의 수탈과 항일의 불꽃 — 경기 서남부</option>
                        </optgroup>
                    </select>
                </div>

                <div id="courseWarnings" class="warnings"></div>

                <div id="destinationDisplay" class="destination-group" style="display: none;">
                    <h4>코스 목적지</h4>
                    <div id="destinationList"></div>
                    <div id="restaurantInfo" style="display:none;"></div>
                </div>
            </div>

            <div class="panel-section">
                <button class="btn-primary" id="calculateBtn" disabled>동선 계산</button>
                <button class="btn-print" id="printBtn" disabled style="display: none;">코스 인쇄</button>
            </div>

            <div class="route-results">
                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
                <div id="routeSummary" class="route-summary"></div>
                <div id="scheduleContainer" class="schedule-container"></div>
            </div>
        </div>

        <div class="right-area">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="map">지도</button>
                <button class="tab-btn" data-tab="text">텍스트 모드</button>
            </div>

            <div id="mapTab" class="tab-content active">
                <div id="map"></div>
                <div id="mapFallback" class="map-fallback">
                    <p>📍 지도 로딩 중... (표시되지 않으면 카카오 개발자콘솔 도메인 등록을 확인하세요)</p>
                    <p style="font-size: 12px; color: #aaa;">텍스트 모드에서 동선 정보를 확인할 수 있습니다.</p>
                </div>
            </div>

            <div id="textTab" class="tab-content">
                <div class="text-mode">
                    <div id="textModeContent">
                        <div style="padding:40px;text-align:center;color:#888;">
                            <p style="font-size:14px;">📋 학교와 코스를 선택한 뒤 <b>동선 계산</b> 버튼을 클릭하세요.</p>
                            <p style="font-size:12px;margin-top:8px;">계산이 완료되면 이 화면에 상세 일정표가 표시됩니다.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 코스 데이터
        const COURSES = [
            { id:'C-01', region:'경기 파주', name:'분단선에 서다 — DMZ 평화 탐방', target:'중·고등',
                places:['임진각 국민관광지(자유의다리·독개다리·평화누리공원)', '국립6.25전쟁납북자기념관', '오두산통일전망대'], warnings:['기존 G-01/G-02 통합·보완 · 안보관광 통합예약 필요'] },
            { id:'C-02', region:'경기 연천', name:'DMZ 생태와 역사, 접경의 두 얼굴', target:'중·고등',

        // 학교 검색
        async function searchSchool(e) {
            const query = e.target.value.trim();
            const resultsEl = document.getElementById('schoolResults');

            if (query.length < 2) {
                resultsEl.classList.remove('show');
                return;
            }

            const restApiKey = KAKAO_REST_KEY;
            if (!restApiKey) {
                showError('REST API 키를 입력하세요.');
                return;
            }

            try {
                const response = await fetch(
                    `https://dapi.kakao.com/v2/local/search/keyword.json?query=${encodeURIComponent(query)}&size=10`,
                    {
                        headers: {
                            'Authorization': `KakaoAK ${restApiKey}`
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error('API 요청 실패');
                }

                const data = await response.json();
                const places = data.documents || [];

                if (places.length === 0) {
                    resultsEl.innerHTML = '<div class="search-result-item">검색 결과가 없습니다.</div>';
                    resultsEl.classList.add('show');
                    return;
                }

                resultsEl.innerHTML = places.map(place => `
                    <div class="search-result-item" data-lat="${place.y}" data-lng="${place.x}" data-name="${place.place_name}" data-addr="${place.road_address_name || place.address_name}">
                        <div class="place-name">${place.place_name}</div>
                        <div class="place-addr">${place.road_address_name || place.address_name}</div>
                    </div>
                `).join('');

                resultsEl.classList.add('show');

                resultsEl.querySelectorAll('.search-result-item').forEach(item => {
                    item.addEventListener('click', () => selectSchool(item));
                });
            } catch (error) {
                showError('학교 검색 중 오류가 발생했습니다: ' + error.message);
            }
        }

        // 동선 계산
        async function calculateRoute() {
            if (!selectedSchool || !selectedCourse) {
                showError('학교와 코스를 선택하세요.');
                return;
            }

            const restApiKey = KAKAO_REST_KEY;
            if (!restApiKey) {
                showError('REST API 키를 입력하세요.');
                return;
            }

            const btn = document.getElementById('calculateBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>계산 중...';

            try {
                const places = selectedCourse.places;
                const segments = [];

                // 세 개의 구간 계산: 학교→장소1, 장소1→장소2, 장소2→장소3, 장소3→학교
                const legs = [
                    { from: 'school', to: places[0] },
                    { from: places[0], to: places[1] },
                    { from: places[1], to: places[2] },
                    { from: places[2], to: 'school' }
                ];

                for (const leg of legs) {
                    const fromCoords = leg.from === 'school'
                        ? selectedSchool
                        : PLACES[leg.from];
                    const toCoords = leg.to === 'school'
                        ? selectedSchool
                        : PLACES[leg.to];

                    const fromName = leg.from === 'school' ? selectedSchool.name : leg.from;
                    const toName = leg.to === 'school' ? selectedSchool.name : leg.to;

                    const segment = await getDirections(
                        restApiKey,
                        fromCoords.lat,
                        fromCoords.lng,
                        toCoords.lat,
                        toCoords.lng,
                        fromName,
                        toName
                    );

                    segments.push(segment);
                }

                currentRoute = {
                    school: selectedSchool,
                    course: selectedCourse,
                    segments: segments
                };

                displayRouteResults();
                updateMapDisplay();
                showSuccess('동선이 계산되었습니다.');
                document.getElementById('printBtn').style.display = 'block';

            } catch (error) {
                showError('동선 계산 중 오류: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '동선 계산';
            }
        }

        async function getDirections(apiKey, startLat, startLng, endLat, endLng, startName, endName) {
            // Kakao Mobility Directions API는 GET 방식, 좌표 파라미터는 "경도,위도" 순서
            const url = `https://apis-navi.kakaomobility.com/v1/directions?origin=${startLng},${startLat}&destination=${endLng},${endLat}&priority=RECOMMEND&car_fuel=GASOLINE&car_hipass=false&alternatives=false&road_details=false`;
            const response = await fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `KakaoAK ${apiKey}`
                }
            });

            if (!response.ok) {
                const errText = await response.text();
                throw new Error(`경로 계산 API 오류 (${response.status}): ${errText}`);
            }

            const data = await response.json();
            const route = data.routes[0];

            if (!route) {
                throw new Error('경로를 찾을 수 없습니다.');
            }

            const summary = route.summary;
            const duration = Math.ceil(summary.duration / 60); // 초를 분으로 변환
            const distance = (summary.distance / 1000).toFixed(1); // 미터를 km로 변환

            return {
                from: startName,
                to: endName,
                distance: distance,
                duration: duration,
                routes: route.sections || [],
                startLat: startLat,
                startLng: startLng,
                endLat: endLat,
                endLng: endLng
            };
        }

        function displayRouteResults() {
            displayRouteSummary();
            displaySchedule();
            displayTextMode();
        }

        function displayRouteSummary() {
            const summaryEl = document.getElementById('routeSummary');
            const segments = currentRoute.segments;

            const html = `
                <h3 style="margin-bottom: 12px; color: #1A3A5C;">동선 요약</h3>
                ${segments.map((seg, idx) => `
                    <div class="route-segment">
                        <div class="from-to">${idx + 1}. ${seg.from} → ${seg.to}</div>
                        <div class="details">
                            <span class="distance">${seg.distance} km</span>
                            <span class="time">${seg.duration}분</span>
                        </div>
                    </div>
                `).join('')}
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #E0E8F0; font-size: 12px; color: #666;">
                    <strong>총 이동거리:</strong> ${segments.reduce((sum, s) => sum + parseFloat(s.distance), 0).toFixed(1)} km<br>
                    <strong>총 이동시간:</strong> ${segments.reduce((sum, s) => sum + s.duration, 0)}분
                </div>
            `;

            summaryEl.innerHTML = html;
            summaryEl.classList.add('show');
        }

        function displaySchedule() {
            const scheduleEl = document.getElementById('scheduleContainer');
            const segments = currentRoute.segments;
            const places = currentRoute.course.places;

            let currentTime = 8 * 60 + 30; // 08:30
            const timeline = [];

            timeline.push({
                time: formatTime(currentTime),
                event: '학교 출발',
                type: 'depart'
            });

            // 각 장소 방문
            for (let i = 0; i < places.length; i++) {
                currentTime += segments[i].duration;
                timeline.push({
                    time: formatTime(currentTime),
                    event: `${places[i]} 도착`,
                    type: 'arrive'
                });

                const stayMin = PLACES[places[i]].stayMin;
                currentTime += stayMin;

                timeline.push({
                    time: formatTime(currentTime),
                    event: `${places[i]} 출발 (${stayMin}분 체류)`,
                    type: 'depart'
                });
            }

            // 학교 귀교
            currentTime += segments[3].duration;
            timeline.push({
                time: formatTime(currentTime),
                event: '학교 귀교',
                type: 'arrive'
            });

            const html = `
                <div class="schedule-title">📅 일정표 (08:30 출발 기준)</div>
                <div class="timeline">
                    ${timeline.map(item => `
                        <div class="timeline-item ${item.type}">
                            <div class="time">${item.time}</div>
                            <div class="event">${item.event}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            scheduleEl.innerHTML = html;
            scheduleEl.classList.add('show');
        }

        function formatTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${String(hours).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
        }

        function displayTextMode() {
            const textEl = document.getElementById('textModeContent');
            const segments = currentRoute.segments;
            const places = currentRoute.course.places;

            let html = `
                <div class="course-info">
                    <h3>${currentRoute.course.id} | ${currentRoute.course.name}</h3>
                    <p>${currentRoute.course.region}</p>
                    <div class="course-meta">
                        <div>🎯 대상: ${currentRoute.course.target}</div>
                        <div>📍 3개 장소</div>
                    </div>
                </div>

                <div class="route-info">
                    <h4>학교 출발점</h4>
                    <div class="route-leg">
                        <strong>${currentRoute.school.name}</strong><br>
                        <div style="font-size: 11px; color: #888; margin-top: 4px;">${currentRoute.school.addr}</div>
                    </div>
                </div>

                <div class="route-info">
                    <h4>방문 장소 및 이동 경로</h4>
            `;

            for (let i = 0; i < places.length; i++) {
                const place = places[i];
                const placeData = PLACES[place];
                const segment = segments[i];

                html += `
                    <div class="route-leg">
                        <div style="margin-bottom: 6px;">
                            <strong>${i + 1}. ${place}</strong>
                            <span style="color: #888; font-size: 11px;">입장료: ${placeData.fee}</span>
                        </div>
                        <div style="font-size: 11px; color: #888;">${placeData.addr}</div>
                        ${!placeData.busOk ? '<div style="color: #C33; font-size: 11px; margin-top: 4px;">🚌 대형버스 진입 불가</div>' : ''}
                    </div>
                    <div class="route-leg" style="background: #F0F4F8; border-left-color: #8BA7C8;">
                        <div class="distance">${segment.distance} km</div>
                        <div class="time">소요시간: ${segment.duration}분 (체류: ${placeData.stayMin}분)</div>
                    </div>
                `;
            }

            html += `
                    <div class="route-leg">
                        <strong>귀교</strong><br>
                        <div style="font-size: 11px; color: #888; margin-top: 4px;">${currentRoute.school.name}</div>
                    </div>
                    <div class="route-leg" style="background: #F0F4F8; border-left-color: #8BA7C8;">
                        <div class="distance">${segments[3].distance} km</div>
                        <div class="time">소요시간: ${segments[3].duration}분</div>
                    </div>
                </div>

                <div class="route-info">
                    <h4>📊 통계</h4>
                    <div class="route-leg">
                        <div>총 이동거리: <strong>${segments.reduce((sum, s) => sum + parseFloat(s.distance), 0).toFixed(1)} km</strong></div>
                        <div>총 이동시간: <strong>${segments.reduce((sum, s) => sum + s.duration, 0)}분</strong></div>
                        <div>총 체류시간: <strong>${places.reduce((sum, p) => sum + PLACES[p].stayMin, 0)}분</strong></div>
                    </div>
                </div>
            `;

            textEl.innerHTML = html;
        }

        // 지도 표시
        function initializeMap() {
            const key = KAKAO_JS_KEY;
            if (!key) return;

            const script = document.createElement('script');
            script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&autoload=false`;
            script.onload = () => {
                kakao.maps.load(() => {
                    const container = document.getElementById('map');
                    const options = {
                        center: new kakao.maps.LatLng(37.5, 127),
                        level: 8
                    };
                    map = new kakao.maps.Map(container, options);
                    document.getElementById('mapFallback').classList.remove('show');
                    document.getElementById('map').style.display = 'block';
                    if (currentRoute) updateMapDisplay();
                });
            };
            script.onerror = () => {
                showError('지도 SDK 로드 실패 - 카카오 콘솔의 도메인 등록을 확인하세요');
            };
            document.head.appendChild(script);
        }

        function updateMapDisplay() {
            if (!map || !currentRoute) return;

            // 기존 마커, 폴리라인 제거
            markers.forEach(m => m.setMap(null));
            polylines.forEach(p => p.setMap(null));
            markers = [];
            polylines = [];

            const segments = currentRoute.segments;
            const places = currentRoute.course.places;

            // 학교 마커 (초록색)
            addMarker(
                currentRoute.school.lat,
                currentRoute.school.lng,
                currentRoute.school.name,
                '#00AA00'
            );

            // 장소 마커
            const colors = ['#4A7BA7', '#6A9BC8', '#8BA7C8'];
            for (let i = 0; i < places.length; i++) {
                const place = places[i];
                const placeData = PLACES[place];
                addMarker(placeData.lat, placeData.lng, place, colors[i]);
            }

            // 경로 그리기
            segments.forEach((seg, idx) => {
                const points = [
                    new kakao.maps.LatLng(seg.startLat, seg.startLng),
                    new kakao.maps.LatLng(seg.endLat, seg.endLng)
                ];

                const polyline = new kakao.maps.Polyline({
                    path: points,
                    strokeWeight: 3,
                    strokeColor: '#4A7BA7',
                    strokeOpacity: 0.7,
                    strokeStyle: 'solid'
                });

                polyline.setMap(map);
                polylines.push(polyline);
            });

            // 지도 범위 조정
            fitMapBounds();
        }

        function addMarker(lat, lng, title, color) {
            const markerImage = new kakao.maps.MarkerImage(
                `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='${encodeURIComponent(color)}'/%3E%3C/svg%3E`,
                new kakao.maps.Size(24, 24),
                new kakao.maps.Point(12, 12)
            );

            const marker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(lat, lng),
                title: title,
                image: markerImage
            });

            marker.setMap(map);
            markers.push(marker);
        }

        function fitMapBounds() {
            if (markers.length === 0) return;

            const bounds = new kakao.maps.LatLngBounds();
            markers.forEach(m => {
                bounds.extend(m.getPosition());
            });

            map.setBounds(bounds);
        }

        // 인쇄
        function printRoute() {
            window.print();
        }

        // 초기 설정
        document.getElementById('mapFallback').classList.add('show');
        updateCalculateButton();
    </script>
</body>
</html>
